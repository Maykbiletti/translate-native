interface:
  display_name: "Translate Native"
  short_description: "Natürlich übersetzen und Originalschrift bewahren"
  default_prompt: "Use $translate-native to produce native original writing while preserving meaning, protected syntax, native Unicode, diacritics, script, and punctuation in one mandatory workflow."
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
policy:
  products:
  - "chatgpt"
  - "codex"
  - "api"
  - "atlas"
  allow_implicit_invocation: true
dependencies:
  tools:
  - type: "mcp"
    value: "blun-language-guard"
    description: "Mandatory Unicode, orthography, and translation release gate"
