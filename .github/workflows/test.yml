name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  translation-guard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile translate-native/scripts/translation_guard.py translate-native/scripts/blun_language_guard.py translate-native/scripts/language_quality.py translate-native/scripts/pre_output_guard.py translate-native/scripts/language_gateway.py installer/blun_language_guard.py integrations/pre_output_guard.py integrations/language_gateway.py integrations/guard_service.py integrations/enforced_delivery.py integrations/response_subagent_review.py integrations/response_subagent_https_runtime.py integrations/website_localization_subagent_http.py integrations/website_localization_subagent_host.py integrations/website_localization_subagent_host_runtime.py integrations/website_localization_subagent_launcher_http.py integrations/website_localization_subagent_executor.py integrations/website_localization_subagent_executor_runtime.py integrations/website_localization_subagent_backend_http.py
      - name: Test
        run: python -m unittest discover -s tests -v
